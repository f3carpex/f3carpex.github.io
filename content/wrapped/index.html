<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F3 Carpex 2025 Wrapped</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow-x: hidden;
        }
        
        .slide {
            transition: transform 0.5s ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .animate-spin {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ===== CONFIGURATION =====
        // IMPORTANT: Replace this with your actual Render.com backend URL
        const API_URL = 'https://f3-wrapped-api.onrender.com';
        
        // ===== STATE =====
        let currentSlide = 0;
        let wrappedData = null;
        let paxList = [];
        let selectedPax = '';
        
        // ===== ICONS (SVG strings) =====
        const icons = {
            mapPin: '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>',
            award: '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"></circle><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"></path></svg>',
            users: '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
            trendingUp: '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>',
            zap: '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
            calendar: '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect><line x1="16" x2="16" y1="2" y2="6"></line><line x1="8" x2="8" y1="2" y2="6"></line><line x1="3" x2="21" y1="10" y2="10"></line></svg>',
            chevronRight: '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
            loader: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin"><line x1="12" x2="12" y1="2" y2="6"></line><line x1="12" x2="12" y1="18" y2="22"></line><line x1="4.93" x2="7.76" y1="4.93" y2="7.76"></line><line x1="16.24" x2="19.07" y1="16.24" y2="19.07"></line><line x1="2" x2="6" y1="12" y2="12"></line><line x1="18" x2="22" y1="12" y2="12"></line><line x1="4.93" x2="7.76" y1="19.07" y2="16.24"></line><line x1="16.24" x2="19.07" y1="7.76" y2="4.93"></line></svg>'
        };
        
        // ===== API CALLS =====
        async function fetchPaxList() {
            try {
                const response = await fetch(`${API_URL}/api/pax`);
                const data = await response.json();
                paxList = data.pax || [];
            } catch (error) {
                console.error('Failed to load PAX list:', error);
                showError('Unable to connect to server. Please try again later.');
            }
        }
        
        async function fetchWrappedData(paxName) {
            const response = await fetch(`${API_URL}/api/wrapped?pax=${encodeURIComponent(paxName)}&year=2025`);
            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error(`No data found for PAX: ${paxName}`);
                }
                throw new Error('Failed to load data');
            }
            return await response.json();
        }
        
        // ===== SLIDE CONTENT GENERATORS =====
        function generateSlides(data) {
            const stats = data.stats;
            const slides = [];
            
            // Slide 0: Title
            slides.push({
                bg: 'from-red-600 to-red-800',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        <h1 class="text-6xl font-black mb-4 animate-pulse">F3 Carpex</h1>
                        <h2 class="text-4xl font-bold mb-2">2025 WRAPPED</h2>
                        <p class="text-2xl font-light mt-4">${data.pax_name}</p>
                        <p class="text-sm mt-8 opacity-80">Let's see how you showed up this year</p>
                    </div>
                `
            });
            
            // Slide 1: Total Workouts
            const workoutMicrocopy = stats.total_workouts >= 200 ? "Are you even human? Respect." :
                                     stats.total_workouts >= 100 ? "Triple digits! You're no fartsack." :
                                     stats.total_workouts >= 50 ? "Solid commitment. The gloom awaits." :
                                     "Getting started! Every post counts.";
            
            slides.push({
                bg: 'from-blue-600 to-blue-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        <div class="text-8xl font-black mb-4">${stats.total_workouts}</div>
                        <h2 class="text-3xl font-bold mb-2">WORKOUTS</h2>
                        <p class="text-xl text-center mt-4">You posted ${stats.total_workouts} times in 2025</p>
                        <p class="text-sm mt-8 opacity-80">${workoutMicrocopy}</p>
                    </div>
                `
            });
            
            // Slide 2: Most Visited AO
            slides.push({
                bg: 'from-purple-600 to-purple-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        ${icons.mapPin}
                        <h2 class="text-2xl font-bold mb-8 opacity-80 mt-6">YOUR HOME AO</h2>
                        <div class="text-5xl font-black mb-4 text-center">${stats.most_visited_ao.name}</div>
                        <div class="text-6xl font-black text-yellow-300">${stats.most_visited_ao.percentage}%</div>
                        <p class="text-lg mt-6 opacity-90">of your posts</p>
                        <p class="text-sm mt-8 opacity-70">This is where you belong</p>
                    </div>
                `
            });
            
            // Slide 3: AO Explorer
            const aoMicrocopy = stats.unique_aos >= 7 ? "True AO explorer" :
                               stats.unique_aos >= 4 ? "Adventurous spirit" :
                               stats.unique_aos >= 2 ? "You like to keep it familiar" :
                               "Loyal to your home base";
            
            slides.push({
                bg: 'from-green-600 to-green-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        <h2 class="text-2xl font-bold mb-8 opacity-80">AO HOPPING</h2>
                        <div class="text-8xl font-black mb-4">${stats.unique_aos}</div>
                        <p class="text-xl mb-2">different AOs</p>
                        <p class="text-lg mt-6 text-center">You hit ${stats.unique_aos} different AOs this year</p>
                        <p class="text-sm mt-8 opacity-70">${aoMicrocopy}</p>
                    </div>
                `
            });
            
            // Slide 4: Top 3 AOs
            const top3Html = stats.top_3_aos.map((ao, idx) => `
                <div class="flex items-center justify-between bg-white bg-opacity-10 p-4 rounded-lg">
                    <div class="flex items-center gap-4">
                        <div class="text-4xl font-black text-yellow-300">${idx + 1}</div>
                        <div class="text-left">
                            <div class="text-xl font-bold">${ao.name}</div>
                            <div class="text-sm opacity-80">${ao.count} posts</div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            slides.push({
                bg: 'from-orange-600 to-orange-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        <h2 class="text-3xl font-bold mb-12">YOUR TOP SPOTS</h2>
                        <div class="space-y-6 w-full max-w-md">${top3Html}</div>
                        <p class="text-sm mt-8 opacity-70">Where the magic happened</p>
                    </div>
                `
            });
            
            // Slide 5: Qs Led
            const qMicrocopy = stats.qs_led >= 13 ? "Q machine" :
                              stats.qs_led >= 6 ? "Regular Q material" :
                              stats.qs_led >= 1 ? "Leadership looks good on you" :
                              "No Qs this year—next year's the year!";
            
            slides.push({
                bg: 'from-red-700 to-red-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        ${icons.award}
                        <h2 class="text-2xl font-bold mb-8 opacity-80 mt-6">THE Q</h2>
                        <div class="text-8xl font-black mb-4">${stats.qs_led}</div>
                        <p class="text-xl mb-2">BEATDOWNS LED</p>
                        <p class="text-lg mt-6 text-center">You stepped into the circle of trust ${stats.qs_led} times</p>
                        <p class="text-sm mt-8 opacity-70">${qMicrocopy}</p>
                    </div>
                `
            });
            
            // Slide 6: First Q (conditional)
            if (stats.first_q_date) {
                const qDate = new Date(stats.first_q_date).toLocaleDateString('en-US', { 
                    month: 'long', day: 'numeric', year: 'numeric' 
                });
                
                slides.push({
                    bg: 'from-indigo-600 to-indigo-900',
                    html: `
                        <div class="flex flex-col items-center justify-center h-full text-white px-8">
                            ${icons.calendar}
                            <h2 class="text-2xl font-bold mb-8 opacity-80 mt-6">LEADERSHIP UNLOCKED</h2>
                            <div class="text-4xl font-black mb-4">${qDate}</div>
                            <p class="text-lg mt-6 text-center">You led your first 2025 beatdown</p>
                            <p class="text-sm mt-8 opacity-70">Never forget your first time in the spotlight each year! Can you go earlier next year?</p>
                        </div>
                    `
                });
            }
            
            // Slide 7: Most Active Month
            slides.push({
                bg: 'from-cyan-600 to-cyan-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        ${icons.trendingUp}
                        <h2 class="text-2xl font-bold mb-8 opacity-80 mt-6">PEAK PERFORMANCE</h2>
                        <div class="text-5xl font-black mb-4">${stats.most_active_month.month.toUpperCase()}</div>
                        <div class="text-3xl font-bold text-yellow-300">2025</div>
                        <p class="text-xl mt-6">Your grind peaked with</p>
                        <p class="text-4xl font-black mt-2">${stats.most_active_month.count} posts</p>
                        <p class="text-sm mt-8 opacity-70">You were unstoppable</p>
                    </div>
                `
            });
            
            // Slide 8: Longest Streak
            const streakMicrocopy = stats.longest_streak >= 30 ? "Legendary status. No fartsacks detected." :
                                   stats.longest_streak >= 14 ? "Two week machine" :
                                   stats.longest_streak >= 7 ? "Week+ warrior" :
                                   stats.longest_streak >= 3 ? "Building momentum" :
                                   "Short bursts work too";
            
            slides.push({
                bg: 'from-yellow-600 to-orange-700',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        ${icons.zap}
                        <h2 class="text-2xl font-bold mb-8 opacity-80 mt-6">STREAK MODE</h2>
                        <div class="text-8xl font-black mb-4">${stats.longest_streak}</div>
                        <p class="text-2xl mb-2">DAYS IN A ROW</p>
                        <p class="text-lg mt-6">Your longest streak was ${stats.longest_streak} days</p>
                        <p class="text-sm mt-8 opacity-70">${streakMicrocopy}</p>
                    </div>
                `
            });
            
            // Slide 9: Your Crew
            const partnersHtml = stats.top_partners.map(partner => `
                <div class="bg-white bg-opacity-10 p-4 rounded-lg">
                    <div class="text-2xl font-bold">${partner.name}</div>
                    <div class="text-sm opacity-80">${partner.shared_workouts} workouts together</div>
                </div>
            `).join('');
            
            slides.push({
                bg: 'from-pink-600 to-pink-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        ${icons.users}
                        <h2 class="text-3xl font-bold mb-4 mt-6">YOUR CREW</h2>
                        <p class="text-lg mb-8 opacity-80">You suffered most often with:</p>
                        <div class="space-y-4 w-full max-w-md">${partnersHtml}</div>
                        <p class="text-sm mt-8 opacity-70">Brotherhood forged in the gloom</p>
                    </div>
                `
            });
            
            // Slide 10: Badge
            slides.push({
                bg: 'from-purple-700 to-indigo-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8">
                        <h2 class="text-2xl font-bold mb-8 opacity-80">YOUR 2025 PERSONALITY</h2>
                        <div class="text-yellow-300">${icons.award}</div>
                        <div class="text-5xl font-black mb-4 text-center text-yellow-300 mt-6">${stats.badge.name}</div>
                        <p class="text-xl italic mb-6 text-center">"${stats.badge.tagline}"</p>
                        <p class="text-lg text-center max-w-md opacity-90">${stats.badge.description}</p>
                    </div>
                `
            });
            
            // Slide 11: Summary
            slides.push({
                bg: 'from-slate-800 to-slate-900',
                html: `
                    <div class="flex flex-col items-center justify-center h-full text-white px-8 py-12">
                        <h2 class="text-3xl font-black mb-2">${data.pax_name}'s</h2>
                        <h3 class="text-2xl font-bold mb-12 text-yellow-300">F3 Carpex 2025 WRAPPED</h3>
                        
                        <div class="grid grid-cols-2 gap-6 w-full max-w-2xl mb-8">
                            <div class="bg-white bg-opacity-10 p-4 rounded-lg text-center">
                                <div class="text-4xl font-black">${stats.total_workouts}</div>
                                <div class="text-sm opacity-80">Total Workouts</div>
                            </div>
                            <div class="bg-white bg-opacity-10 p-4 rounded-lg text-center">
                                <div class="text-4xl font-black">${stats.unique_aos}</div>
                                <div class="text-sm opacity-80">Unique AOs</div>
                            </div>
                            <div class="bg-white bg-opacity-10 p-4 rounded-lg text-center">
                                <div class="text-4xl font-black">${stats.qs_led}</div>
                                <div class="text-sm opacity-80">Beatdowns Led</div>
                            </div>
                            <div class="bg-white bg-opacity-10 p-4 rounded-lg text-center">
                                <div class="text-4xl font-black">${stats.longest_streak}</div>
                                <div class="text-sm opacity-80">Longest Streak</div>
                            </div>
                        </div>
                        
                        <div class="bg-white bg-opacity-10 p-4 rounded-lg w-full max-w-2xl mb-4">
                            <div class="text-center">
                                <div class="text-xl font-bold text-yellow-300">${stats.badge.name}</div>
                                <div class="text-sm opacity-80">${stats.most_active_month.month} was your peak</div>
                            </div>
                        </div>
                        
                        <button onclick="resetApp()" class="mt-6 px-6 py-3 bg-red-600 hover:bg-red-700 rounded-lg font-bold transition">
                            View Another PAX
                        </button>
                        
                        <p class="text-xs mt-8 opacity-60">F3 Carpex 2025 | Share your wrapped!</p>
                    </div>
                `
            });
            
            return slides;
        }
        
        // ===== RENDERING FUNCTIONS =====
        function renderLandingPage() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-red-600 to-red-900 flex items-center justify-center p-8">
                    <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl">
                        <h1 class="text-4xl font-black text-center mb-2 text-red-700">F3 Carpex 2025</h1>
                        <h2 class="text-2xl font-bold text-center mb-8 text-gray-700">WRAPPED</h2>
                        
                        <div class="mb-6 relative">
                            <label class="block text-sm font-semibold mb-2 text-gray-700">Select Your Name</label>
                            <input
                                type="text"
                                id="paxInput"
                                placeholder="Start typing your F3 name..."
                                class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-red-500 focus:outline-none text-gray-800"
                            />
                            <div id="dropdown" class="hidden absolute z-10 w-full mt-1 bg-white border-2 border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto"></div>
                        </div>
                        
                        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
                        
                        <button
                            id="submitBtn"
                            onclick="handleSubmit()"
                            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-lg transition disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                        >
                            See My 2025 Wrapped
                        </button>
                        
                        <p class="text-center text-xs text-gray-500 mt-4">
                            Experience your year in the gloom
                        </p>
                    </div>
                </div>
            `;
            
            // Set up autocomplete
            const input = document.getElementById('paxInput');
            const dropdown = document.getElementById('dropdown');
            
            input.addEventListener('input', (e) => {
                selectedPax = e.target.value;
                const filtered = paxList.filter(pax => 
                    pax.toLowerCase().includes(selectedPax.toLowerCase())
                ).slice(0, 10);
                
                if (filtered.length > 0 && selectedPax) {
                    dropdown.innerHTML = filtered.map(pax => `
                        <button onclick="selectPax('${pax.replace(/'/g, "\\'")}');" class="w-full text-left px-4 py-3 hover:bg-red-50 text-gray-800 transition">
                            ${pax}
                        </button>
                    `).join('');
                    dropdown.classList.remove('hidden');
                } else {
                    dropdown.classList.add('hidden');
                }
            });
            
            input.addEventListener('focus', () => {
                if (dropdown.innerHTML) {
                    dropdown.classList.remove('hidden');
                }
            });
            
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleSubmit();
                }
            });
            
            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });
        }
        
        function renderWrapped(slides) {
            const app = document.getElementById('app');
            
            const slidesHtml = slides.map((slide, idx) => `
                <div class="slide absolute inset-0 bg-gradient-to-br ${slide.bg}" style="transform: translateX(${idx === 0 ? '0' : '100%'})">
                    ${slide.html}
                </div>
            `).join('');
            
            const dotsHtml = slides.map((_, idx) => `
                <div class="h-2 rounded-full transition-all ${idx === 0 ? 'w-8 bg-white' : 'w-2 bg-white bg-opacity-40'}"></div>
            `).join('');
            
            app.innerHTML = `
                <div class="relative w-full h-screen overflow-hidden">
                    ${slidesHtml}
                    
                    <!-- Navigation -->
                    <div class="absolute bottom-8 left-0 right-0 flex justify-center items-center gap-4 px-8">
                        <button onclick="prevSlide()" id="prevBtn" class="text-white disabled:opacity-30 disabled:cursor-not-allowed">
                            <div style="transform: rotate(180deg)">${icons.chevronRight}</div>
                        </button>
                        
                        <div id="dots" class="flex gap-2">
                            ${dotsHtml}
                        </div>
                        
                        <button onclick="nextSlide()" id="nextBtn" class="text-white">
                            ${icons.chevronRight}
                        </button>
                    </div>
                    
                    <!-- Slide counter -->
                    <div class="absolute top-4 right-4 text-white text-opacity-60 text-sm">
                        <span id="slideCounter">1</span> / ${slides.length}
                    </div>
                </div>
            `;
            
            updateNavigation(slides.length);
        }
        
        // ===== EVENT HANDLERS =====
        function selectPax(pax) {
            selectedPax = pax;
            document.getElementById('paxInput').value = pax;
            document.getElementById('dropdown').classList.add('hidden');
        }
        
        async function handleSubmit() {
            if (!selectedPax.trim()) {
                showError('Please enter a PAX name');
                return;
            }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<div class="flex items-center justify-center gap-2">${icons.loader} <span>Loading...</span></div>`;
            
            try {
                wrappedData = await fetchWrappedData(selectedPax);
                const slides = generateSlides(wrappedData);
                renderWrapped(slides);
            } catch (error) {
                showError(error.message);
                btn.disabled = false;
                btn.innerHTML = 'See My 2025 Wrapped';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
            }
        }
        
        function nextSlide() {
            const slides = document.querySelectorAll('.slide');
            if (currentSlide < slides.length - 1) {
                slides[currentSlide].style.transform = 'translateX(-100%)';
                currentSlide++;
                slides[currentSlide].style.transform = 'translateX(0)';
                updateNavigation(slides.length);
            }
        }
        
        function prevSlide() {
            const slides = document.querySelectorAll('.slide');
            if (currentSlide > 0) {
                slides[currentSlide].style.transform = 'translateX(100%)';
                currentSlide--;
                slides[currentSlide].style.transform = 'translateX(0)';
                updateNavigation(slides.length);
            }
        }
        
        function updateNavigation(totalSlides) {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const counter = document.getElementById('slideCounter');
            const dots = document.getElementById('dots').children;
            
            if (prevBtn) prevBtn.disabled = currentSlide === 0;
            if (nextBtn) nextBtn.disabled = currentSlide === totalSlides - 1;
            if (counter) counter.textContent = currentSlide + 1;
            
            // Update dots
            Array.from(dots).forEach((dot, idx) => {
                if (idx === currentSlide) {
                    dot.className = 'h-2 rounded-full transition-all w-8 bg-white';
                } else {
                    dot.className = 'h-2 rounded-full transition-all w-2 bg-white bg-opacity-40';
                }
            });
        }
        
        function resetApp() {
            currentSlide = 0;
            wrappedData = null;
            selectedPax = '';
            renderLandingPage();
        }
        
        // ===== KEYBOARD NAVIGATION =====
        document.addEventListener('keydown', (e) => {
            if (wrappedData) {
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            }
        });
        
        // ===== TOUCH/SWIPE SUPPORT =====
        let touchStartX = 0;
        let touchEndX = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });
        
        document.addEventListener('touchend', (e) => {
            if (!wrappedData) return;
            
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
        
        function handleSwipe() {
            const swipeThreshold = 50;
            const diff = touchStartX - touchEndX;
            
            if (Math.abs(diff) > swipeThreshold) {
                if (diff > 0) {
                    // Swipe left - next slide
                    nextSlide();
                } else {
                    // Swipe right - previous slide
                    prevSlide();
                }
            }
        }
        
        // ===== INITIALIZE =====
        async function init() {
            await fetchPaxList();
            renderLandingPage();
        }
        
        init();
    </script>
</body>
</html>
